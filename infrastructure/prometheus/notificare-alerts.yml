groups:
  - name: NotificareService Alerts
    rules:
      - alert: WARNING-HighThroughput
        expr: rate(num_request_notifications_total[1m]) > 0.5
        for: 2s
        labels:
          severity: warning
        annotations:
          summary: Increased info retrieval rate {{ $labels.value}} {{ $value }}
          description: "A container has disappeared\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: CRITICAL-HighThroughput
        expr: rate(num_request_notifications_total[1m]) > 1
        for: 2s
        labels:
          severity: critical
        annotations:
          summary: Increased info retrieval rate {{ $labels.value}} {{ $value }}
          description: "A container has disappeared\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"